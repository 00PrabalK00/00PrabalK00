<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Prabal Khare robotics repository terminal</title>
  <desc id="desc">An animated terminal that cycles through selected robotics and engineering repositories with a CRT scan effect.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f14"/>
      <stop offset="1" stop-color="#101a20"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ee59d" stop-opacity="0.72"/>
      <stop offset="0.5" stop-color="#6bb8ff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2ee59d" stop-opacity="0.72"/>
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.022"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="screen">
      <rect x="28" y="28" width="1144" height="444" rx="18"/>
    </clipPath>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .small { fill: #79909a; font-size: 15px; letter-spacing: 1.5px; }
      .prompt { fill: #d8e7eb; font-size: 18px; }
      .accent { fill: #48e6a7; }
      .index { fill: #48e6a7; font-size: 15px; letter-spacing: 2px; }
      .repo { fill: #eef8fa; font-size: 42px; font-weight: 700; letter-spacing: -1px; }
      .desc { fill: #b8c9ce; font-size: 20px; }
      .stack { fill: #6bb8ff; font-size: 16px; letter-spacing: 1px; }
    </style>
  </defs>

  <rect x="12" y="12" width="1176" height="476" rx="26" fill="#05080b" stroke="#263840" stroke-width="2"/>
  <rect x="28" y="28" width="1144" height="444" rx="18" fill="url(#shell)" stroke="url(#edge)" stroke-width="1.5"/>

  <g clip-path="url(#screen)">
    <rect x="28" y="28" width="1144" height="444" fill="url(#scanlines)"/>
    <rect x="28" y="28" width="1144" height="444" fill="none" stroke="#ffffff" stroke-opacity="0.025" stroke-width="20"/>

    <text x="70" y="72" class="small">PRABAL KHARE  /  ROBOTICS ENGINEER</text>
    <text x="70" y="118" class="prompt"><tspan class="accent">prabal@autonomy</tspan><tspan fill="#79909a">:</tspan><tspan fill="#6bb8ff">~/projects</tspan><tspan fill="#79909a">$</tspan><tspan> repo-index --signal high</tspan></text>
    <rect x="682" y="99" width="10" height="22" rx="1" fill="#48e6a7">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <g opacity="1">
      <animate attributeName="opacity" values="1;1;1;1;0;0" keyTimes="0;0.000000;0.012000;0.078909;0.090909;1" dur="44.0s" repeatCount="indefinite"/>
      <text x="78" y="184" class="index">[01/10]  PUBLIC REPOSITORY</text>
      <text x="78" y="242" class="repo">RosScope</text>
      <text x="78" y="292" class="desc">ROS 2 runtime monitoring and control for nodes, diagnostics and fleets.</text>
      <text x="78" y="346" class="stack">C++  •  Qt 6  •  ROS 2</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.090909;0.102909;0.169818;0.181818;1" dur="44.0s" repeatCount="indefinite"/>
      <text x="78" y="184" class="index">[02/10]  PUBLIC REPOSITORY</text>
      <text x="78" y="242" class="repo">OpenRosWarehouse</text>
      <text x="78" y="292" class="desc">Warehouse autonomy stack for missions, Nav2, shelf workflows and safety.</text>
      <text x="78" y="346" class="stack">ROS 2  •  Nav2  •  LiDAR</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.181818;0.193818;0.260727;0.272727;1" dur="44.0s" repeatCount="indefinite"/>
      <text x="78" y="184" class="index">[03/10]  PUBLIC REPOSITORY</text>
      <text x="78" y="242" class="repo">next_HI</text>
      <text x="78" y="292" class="desc">CANopen hardware integration for Kinco drives, ros2_control and lift actuation.</text>
      <text x="78" y="346" class="stack">C++  •  CANopen  •  CiA 402</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.272727;0.284727;0.351636;0.363636;1" dur="44.0s" repeatCount="indefinite"/>
      <text x="78" y="184" class="index">[04/10]  PUBLIC REPOSITORY</text>
      <text x="78" y="242" class="repo">slamtec_ros2_slamkit_imu</text>
      <text x="78" y="292" class="desc">IMU wrapper, EKF pipeline and Allan variance calibration tooling.</text>
      <text x="78" y="346" class="stack">ROS 2  •  Sensor Fusion  •  Python</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.363636;0.375636;0.442545;0.454545;1" dur="44.0s" repeatCount="indefinite"/>
      <text x="78" y="184" class="index">[05/10]  PUBLIC REPOSITORY</text>
      <text x="78" y="242" class="repo">Project MIRA</text>
      <text x="78" y="292" class="desc">Autonomous underwater vehicle control, perception, docking and visualization.</text>
      <text x="78" y="346" class="stack">ROS  •  OpenCV  •  AUV</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.454545;0.466545;0.533455;0.545455;1" dur="44.0s" repeatCount="indefinite"/>
      <text x="78" y="184" class="index">[06/10]  PUBLIC REPOSITORY</text>
      <text x="78" y="242" class="repo">Pushpak Viman</text>
      <text x="78" y="292" class="desc">Aerial search and rescue perception pipeline for victim detection.</text>
      <text x="78" y="346" class="stack">Computer Vision  •  UAV  •  TensorFlow</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.545455;0.557455;0.624364;0.636364;1" dur="44.0s" repeatCount="indefinite"/>
      <text x="78" y="184" class="index">[07/10]  PUBLIC REPOSITORY</text>
      <text x="78" y="242" class="repo">OpenDroneKit</text>
      <text x="78" y="292" class="desc">Offline first drone inspection, mission planning, analytics and reconstruction.</text>
      <text x="78" y="346" class="stack">Python  •  COLMAP  •  Inspection</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.636364;0.648364;0.715273;0.727273;1" dur="44.0s" repeatCount="indefinite"/>
      <text x="78" y="184" class="index">[08/10]  PUBLIC REPOSITORY</text>
      <text x="78" y="242" class="repo">Structural Inspection Kit</text>
      <text x="78" y="292" class="desc">Desktop toolkit for crack detection, defect analysis and 3D reconstruction.</text>
      <text x="78" y="346" class="stack">PyQt  •  Vision  •  COLMAP</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.727273;0.739273;0.806182;0.818182;1" dur="44.0s" repeatCount="indefinite"/>
      <text x="78" y="184" class="index">[09/10]  PUBLIC REPOSITORY</text>
      <text x="78" y="242" class="repo">Pan Tilt Calib</text>
      <text x="78" y="292" class="desc">Backlash aware stereo calibration using an EKF, IMU and laser correction.</text>
      <text x="78" y="346" class="stack">Jetson  •  EKF  •  Stereo Vision</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.818182;0.830182;0.897091;0.909091;1" dur="44.0s" repeatCount="indefinite"/>
      <text x="78" y="184" class="index">[10/10]  PUBLIC REPOSITORY</text>
      <text x="78" y="242" class="repo">RobotDrawing</text>
      <text x="78" y="292" class="desc">Graph based stroke routing that reduces pen travel for robotic drawing.</text>
      <text x="78" y="346" class="stack">PyTorch  •  GNN  •  Optimization</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.909091;0.918182;0.986364;1" dur="44.0s" repeatCount="indefinite"/>
      <text x="78" y="205" class="index">SCAN COMPLETE</text>
      <text x="78" y="266" class="repo">clear</text>
      <text x="78" y="316" class="desc">Reindexing autonomous systems...</text>
    </g>

    <line x1="70" y1="390" x2="1130" y2="390" stroke="#263840"/>
    <text x="70" y="426" class="small">ROS 2  •  AUTONOMY  •  PERCEPTION  •  EMBEDDED CONTROL</text>
    <text x="1130" y="426" class="small" text-anchor="end">10 HIGH SIGNAL SYSTEMS</text>

    <rect x="28" y="28" width="1144" height="4" fill="#d9fff0" opacity="0.1" filter="url(#glow)">
      <animate attributeName="y" values="30;466;30" keyTimes="0;0.96;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.16;0.03;0" keyTimes="0;0.2;0.85;1" dur="5s" repeatCount="indefinite"/>
    </rect>

    <rect x="28" y="28" width="1144" height="444" fill="#dffff1" opacity="0">
      <animate attributeName="opacity" values="0;0;0.08;0;0.22;0" keyTimes="0;0.91;0.925;0.94;0.955;1" dur="44.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="70" y="248" width="1060" height="2" fill="#dffff1" opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.925;0.94;0.965;1" dur="44.0s" repeatCount="indefinite"/>
      <animate attributeName="x" values="70;70;70;590;590" keyTimes="0;0.925;0.94;0.965;1" dur="44.0s" repeatCount="indefinite"/>
      <animate attributeName="width" values="1060;1060;1060;20;20" keyTimes="0;0.925;0.94;0.965;1" dur="44.0s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
