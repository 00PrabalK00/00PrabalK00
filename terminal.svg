<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Prabal Khare robotics repository terminal</title>
  <desc id="desc">An animated terminal that types a command and cycles through selected robotics and engineering repositories with slide transitions and a CRT scan effect.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f14"/>
      <stop offset="1" stop-color="#101a20"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ee59d" stop-opacity="0.72"/>
      <stop offset="0.5" stop-color="#6bb8ff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#2ee59d" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#48e6a7"/>
      <stop offset="1" stop-color="#6bb8ff"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.022"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="screen">
      <rect x="28" y="28" width="1144" height="464" rx="18"/>
    </clipPath>
    <clipPath id="typeClip">
      <rect x="70" y="128" width="0" height="34">
        <animate attributeName="width" values="0;0;640;640" keyTimes="0;0.004;0.03;1" dur="44.0s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .small { fill: #79909a; font-size: 15px; letter-spacing: 1.5px; }
      .prompt { fill: #d8e7eb; font-size: 18px; }
      .accent { fill: #48e6a7; }
      .index { fill: #48e6a7; font-size: 15px; letter-spacing: 2px; }
      .repo { fill: #eef8fa; font-size: 44px; font-weight: 700; letter-spacing: -1px; }
      .desc { fill: #b8c9ce; font-size: 20px; }
      .stack { fill: #6bb8ff; font-size: 16px; letter-spacing: 1px; }
      .star { fill: #ffcf5c; font-size: 16px; letter-spacing: 1px; }
    </style>
  </defs>

  <rect x="12" y="12" width="1176" height="496" rx="26" fill="#05080b" stroke="#263840" stroke-width="2"/>
  <rect x="28" y="28" width="1144" height="464" rx="18" fill="url(#shell)" stroke="url(#edge)" stroke-width="1.5"/>

  <g clip-path="url(#screen)">
    <rect x="28" y="28" width="1144" height="464" fill="url(#scanlines)"/>

    <!-- title bar -->
    <rect x="28" y="28" width="1144" height="44" fill="#0b1218"/>
    <line x1="28" y1="72" x2="1172" y2="72" stroke="#1d2c34"/>
    <circle cx="58" cy="50" r="6" fill="#ff5f57"/>
    <circle cx="80" cy="50" r="6" fill="#febc2e"/>
    <circle cx="102" cy="50" r="6" fill="#28c840"/>
    <text x="600" y="56" class="small" text-anchor="middle">prabal@autonomy — repo-index — 120x32</text>
    <text x="1146" y="56" class="small" text-anchor="end">
      <tspan class="accent">●</tspan> LIVE
    </text>

    <text x="70" y="104" class="small">PRABAL KHARE  /  ROBOTICS ENGINEER  /  prabalkhare.com</text>

    <!-- typed command -->
    <g clip-path="url(#typeClip)">
      <text x="70" y="152" class="prompt"><tspan class="accent">prabal@autonomy</tspan><tspan fill="#79909a">:</tspan><tspan fill="#6bb8ff">~/projects</tspan><tspan fill="#79909a">$</tspan><tspan> repo-index --signal high</tspan></text>
    </g>
    <rect x="70" y="133" width="10" height="22" rx="1" fill="#48e6a7">
      <animate attributeName="x" values="70;70;682;682" keyTimes="0;0.004;0.03;1" dur="44.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0100;0.0809;0.0909;1" dur="44.0s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="translate" values="0 18;0 18;0 0;0 0;0 -14;0 -14" keyTimes="0;0.0000;0.0100;0.0809;0.0909;1" dur="44.0s" repeatCount="indefinite"/>
      <text x="78" y="212" class="index">[01/10]  PUBLIC REPOSITORY<tspan class="star">    ★ 11</tspan></text>
      <text x="78" y="272" class="repo">RosScope</text>
      <text x="78" y="322" class="desc">Oscilloscope-style live debugging for ROS 2 topics, diagnostics and fleets.</text>
      <text x="78" y="376" class="stack">C++  •  Qt 6  •  ROS 2</text>
      </g>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0909;0.1009;0.1718;0.1818;1" dur="44.0s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="translate" values="0 18;0 18;0 0;0 0;0 -14;0 -14" keyTimes="0;0.0909;0.1009;0.1718;0.1818;1" dur="44.0s" repeatCount="indefinite"/>
      <text x="78" y="212" class="index">[02/10]  PUBLIC REPOSITORY<tspan class="star">    ★ 9</tspan></text>
      <text x="78" y="272" class="repo">Continuum</text>
      <text x="78" y="322" class="desc">Local shared memory and controlled workflows for AI coding agents.</text>
      <text x="78" y="376" class="stack">Python  •  MCP  •  Agent Tooling</text>
      </g>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1818;0.1918;0.2627;0.2727;1" dur="44.0s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="translate" values="0 18;0 18;0 0;0 0;0 -14;0 -14" keyTimes="0;0.1818;0.1918;0.2627;0.2727;1" dur="44.0s" repeatCount="indefinite"/>
      <text x="78" y="212" class="index">[03/10]  PUBLIC REPOSITORY<tspan class="star">    ★ 8</tspan></text>
      <text x="78" y="272" class="repo">OpenRosWarehouse</text>
      <text x="78" y="322" class="desc">Warehouse autonomy stack for missions, Nav2, shelf workflows and safety.</text>
      <text x="78" y="376" class="stack">ROS 2  •  Nav2  •  LiDAR</text>
      </g>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2727;0.2827;0.3536;0.3636;1" dur="44.0s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="translate" values="0 18;0 18;0 0;0 0;0 -14;0 -14" keyTimes="0;0.2727;0.2827;0.3536;0.3636;1" dur="44.0s" repeatCount="indefinite"/>
      <text x="78" y="212" class="index">[04/10]  PUBLIC REPOSITORY<tspan class="star">    ★ 3</tspan></text>
      <text x="78" y="272" class="repo">next_EKF</text>
      <text x="78" y="322" class="desc">Odom and IMU fusion after Allan variance analysis of the IMU noise model.</text>
      <text x="78" y="376" class="stack">ROS 2  •  Sensor Fusion  •  EKF</text>
      </g>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3636;0.3736;0.4445;0.4545;1" dur="44.0s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="translate" values="0 18;0 18;0 0;0 0;0 -14;0 -14" keyTimes="0;0.3636;0.3736;0.4445;0.4545;1" dur="44.0s" repeatCount="indefinite"/>
      <text x="78" y="212" class="index">[05/10]  PUBLIC REPOSITORY</text>
      <text x="78" y="272" class="repo">next_HI</text>
      <text x="78" y="322" class="desc">CANopen hardware integration for Kinco drives, ros2_control and lift actuation.</text>
      <text x="78" y="376" class="stack">C++  •  CANopen  •  CiA 402</text>
      </g>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4545;0.4645;0.5354;0.5455;1" dur="44.0s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="translate" values="0 18;0 18;0 0;0 0;0 -14;0 -14" keyTimes="0;0.4545;0.4645;0.5354;0.5455;1" dur="44.0s" repeatCount="indefinite"/>
      <text x="78" y="212" class="index">[06/10]  PUBLIC REPOSITORY<tspan class="star">    ★ 1</tspan></text>
      <text x="78" y="272" class="repo">OpenDroneKit</text>
      <text x="78" y="322" class="desc">Offline-first drone inspection: mission planning, QA, defect analytics, reports.</text>
      <text x="78" y="376" class="stack">Python  •  COLMAP  •  Inspection</text>
      </g>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5455;0.5555;0.6264;0.6364;1" dur="44.0s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="translate" values="0 18;0 18;0 0;0 0;0 -14;0 -14" keyTimes="0;0.5455;0.5555;0.6264;0.6364;1" dur="44.0s" repeatCount="indefinite"/>
      <text x="78" y="212" class="index">[07/10]  PUBLIC REPOSITORY</text>
      <text x="78" y="272" class="repo">Project MIRA</text>
      <text x="78" y="322" class="desc">AUV control, perception and docking. Ranked 2nd at TAC Norway 2024.</text>
      <text x="78" y="376" class="stack">ROS  •  OpenCV  •  AUV</text>
      </g>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6364;0.6464;0.7173;0.7273;1" dur="44.0s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="translate" values="0 18;0 18;0 0;0 0;0 -14;0 -14" keyTimes="0;0.6364;0.6464;0.7173;0.7273;1" dur="44.0s" repeatCount="indefinite"/>
      <text x="78" y="212" class="index">[08/10]  PUBLIC REPOSITORY</text>
      <text x="78" y="272" class="repo">Pushpak Viman</text>
      <text x="78" y="322" class="desc">Aerial search-and-rescue perception for victim detection under debris.</text>
      <text x="78" y="376" class="stack">Computer Vision  •  UAV  •  Deep Learning</text>
      </g>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7273;0.7373;0.8082;0.8182;1" dur="44.0s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="translate" values="0 18;0 18;0 0;0 0;0 -14;0 -14" keyTimes="0;0.7273;0.7373;0.8082;0.8182;1" dur="44.0s" repeatCount="indefinite"/>
      <text x="78" y="212" class="index">[09/10]  PUBLIC REPOSITORY<tspan class="star">    ★ 1</tspan></text>
      <text x="78" y="272" class="repo">FlowPilot</text>
      <text x="78" y="322" class="desc">AI control plane for Node-RED: generate, validate, deploy and debug flows.</text>
      <text x="78" y="376" class="stack">JavaScript  •  MCP  •  Node-RED</text>
      </g>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8182;0.8282;0.8991;0.9091;1" dur="44.0s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="translate" values="0 18;0 18;0 0;0 0;0 -14;0 -14" keyTimes="0;0.8182;0.8282;0.8991;0.9091;1" dur="44.0s" repeatCount="indefinite"/>
      <text x="78" y="212" class="index">[10/10]  PUBLIC REPOSITORY<tspan class="star">    ★ 1</tspan></text>
      <text x="78" y="272" class="repo">prabalk.dev</text>
      <text x="78" y="322" class="desc">Portfolio: a scroll-driven 3D flight through the robots I have built.</text>
      <text x="78" y="376" class="stack">Next.js 16  •  React Three Fiber  •  Tailwind v4</text>
      </g>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.9091;0.9182;0.9864;1" dur="44.0s" repeatCount="indefinite"/>
      <text x="78" y="232" class="index">SCAN COMPLETE</text>
      <text x="78" y="292" class="repo">clear</text>
      <text x="78" y="342" class="desc">Reindexing autonomous systems...</text>
    </g>

    <!-- index progress segments -->
    <g>
      <g fill="#22333b">
        <rect x="78" y="404" width="96" height="4" rx="2"/>
        <rect x="184" y="404" width="96" height="4" rx="2"/>
        <rect x="290" y="404" width="96" height="4" rx="2"/>
        <rect x="396" y="404" width="96" height="4" rx="2"/>
        <rect x="502" y="404" width="96" height="4" rx="2"/>
        <rect x="608" y="404" width="96" height="4" rx="2"/>
        <rect x="714" y="404" width="96" height="4" rx="2"/>
        <rect x="820" y="404" width="96" height="4" rx="2"/>
        <rect x="926" y="404" width="96" height="4" rx="2"/>
        <rect x="1032" y="404" width="96" height="4" rx="2"/>
      </g>
      <g fill="url(#bar)">
        <rect x="78" y="404" width="96" height="4" rx="2" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.0100;0.0809;0.0909;1" dur="44.0s" repeatCount="indefinite"/></rect>
        <rect x="184" y="404" width="96" height="4" rx="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0909;0.1009;0.1718;0.1818;1" dur="44.0s" repeatCount="indefinite"/></rect>
        <rect x="290" y="404" width="96" height="4" rx="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1818;0.1918;0.2627;0.2727;1" dur="44.0s" repeatCount="indefinite"/></rect>
        <rect x="396" y="404" width="96" height="4" rx="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2727;0.2827;0.3536;0.3636;1" dur="44.0s" repeatCount="indefinite"/></rect>
        <rect x="502" y="404" width="96" height="4" rx="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3636;0.3736;0.4445;0.4545;1" dur="44.0s" repeatCount="indefinite"/></rect>
        <rect x="608" y="404" width="96" height="4" rx="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4545;0.4645;0.5354;0.5455;1" dur="44.0s" repeatCount="indefinite"/></rect>
        <rect x="714" y="404" width="96" height="4" rx="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5455;0.5555;0.6264;0.6364;1" dur="44.0s" repeatCount="indefinite"/></rect>
        <rect x="820" y="404" width="96" height="4" rx="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6364;0.6464;0.7173;0.7273;1" dur="44.0s" repeatCount="indefinite"/></rect>
        <rect x="926" y="404" width="96" height="4" rx="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7273;0.7373;0.8082;0.8182;1" dur="44.0s" repeatCount="indefinite"/></rect>
        <rect x="1032" y="404" width="96" height="4" rx="2" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8182;0.8282;0.8991;0.9091;1" dur="44.0s" repeatCount="indefinite"/></rect>
      </g>
    </g>

    <line x1="70" y1="432" x2="1130" y2="432" stroke="#263840"/>
    <text x="70" y="466" class="small">ROS 2  •  AUTONOMY  •  PERCEPTION  •  EMBEDDED CONTROL</text>
    <text x="1130" y="466" class="small" text-anchor="end">10 HIGH SIGNAL SYSTEMS</text>

    <!-- CRT scan sweep -->
    <rect x="28" y="28" width="1144" height="4" fill="#d9fff0" opacity="0.1" filter="url(#glow)">
      <animate attributeName="y" values="30;486;30" keyTimes="0;0.96;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.16;0.03;0" keyTimes="0;0.2;0.85;1" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- reset flash -->
    <rect x="28" y="28" width="1144" height="464" fill="#dffff1" opacity="0">
      <animate attributeName="opacity" values="0;0;0.08;0;0.22;0" keyTimes="0;0.91;0.925;0.94;0.955;1" dur="44.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="70" y="278" width="1060" height="2" fill="#dffff1" opacity="0" filter="url(#glow)">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.925;0.94;0.965;1" dur="44.0s" repeatCount="indefinite"/>
      <animate attributeName="x" values="70;70;70;590;590" keyTimes="0;0.925;0.94;0.965;1" dur="44.0s" repeatCount="indefinite"/>
      <animate attributeName="width" values="1060;1060;1060;20;20" keyTimes="0;0.925;0.94;0.965;1" dur="44.0s" repeatCount="indefinite"/>
    </rect>

    <rect x="28" y="28" width="1144" height="464" fill="url(#vignette)"/>
  </g>
</svg>
